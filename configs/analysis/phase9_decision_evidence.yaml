# Phase 9 decision evidence (DECISION_LOG.md D-045; rule fixed before this was run). Descriptive; no training.
# Every number of the decision rule lives here; scripts/phase9_decision_evidence.py takes only this path.

inputs:
  per_run_csv: experiments/results/metrics/per_run.csv
  per_view_dir: experiments/results/metrics/per_view
  manifest_csv: data/poisoned/MANIFEST.csv
  eval_transforms: data/blender_scenes/transforms_test.json
  train_transforms: data/blender_scenes/transforms_train.json
  cameras_json: data/blender_scenes/cameras.json
  speed_json: experiments/results/phase9/speed_test.json      # written from the scratch speed test (E6)

outputs:
  dir: experiments/results/phase9

seeds: [1, 2, 3]
hard_erasure_conditions: [C1, C2, C3, C4, C5, C7]
budgets: {C1: 5, C2: 10, C3: 20, C4: 30, C5: 50, C7: 20}
c8: {budget_percent: 20, selection_function: sample_farthest_point}
aggregates: [mean_of_psnr, pooled_mse_view_mean_psnr]

rule:
  g3_min_resolvability_ratio: 1.5
  b100_min_step_ratio: 1.0
  cost_cap_hours: 60
  calibration_runs: 1               # C3 seed 1
  chosen_option_runs: 3             # seeds 1-3
  follow_up_runs_if_both: 3         # B100 after C8
  iterations: 200000
  validation_events: 19             # i % 10000 == 0 and 0 < i < 200000 in src/nerf/training.py: 19 events (corrected from 20 before the first run)
  validation_views: 5
  final_eval_views: 75

probes:
  real_photo_dirs: [data/real, data/raw_photos, data/photos, data/llff]
  import_names: [tinycudann, nerfstudio, cv2]
  inpaint_code_grep: [inpaint]
