[project]
name = "nerf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imageio>=2.37.4",
    "lpips>=0.1.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "tensorboard>=2.21.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "tqdm>=4.66.5",
]

[project.scripts]
nerf = "nerf:main"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu130"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
