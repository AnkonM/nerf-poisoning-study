# Phase 6 Step 1 — control convergence probe (D-032, ROADMAP.md Phase 6).
#
# NOT a paper condition and NOT one of METHODOLOGY.md §5's eight conditions.
# This config exists to answer one question before the 24-run sweep starts:
# WHERE DOES THIS SCENE'S TRAINING CURVE ACTUALLY FLATTEN?
#
# D-018's 30,000 iterations was explicitly scoped to the Phase 3 Lego PoC and
# sets no precedent; the final scene needs its own convergence check against its
# own reference, analogous to D-013's pre-committed range for Lego. The answer
# governs all 24 runs and is not changeable afterward without destroying
# cross-condition comparability, so it is measured here rather than assumed.
#
# It trains the real control dataset (data/poisoned/control, byte-identical to
# the clean training split) at a deliberately generous iteration count, with
# val evaluation 4x more frequent than the sweep will use so the curve has
# enough resolution to locate the knee.
#
# Run with an explicit --run-id so it does not collide with the sweep's own
# `control_seed1`, which is a separate, shorter run at the locked count:
#
#   python scripts/train.py configs/poisoning/probe_control_convergence.yaml \
#       --seed 1 --run-id probe_control_convergence --skip-final-eval

defaults:
  - budget_00.yaml

training:
  # Extended 100000 -> 150000 -> 200000 (2026-09-18/19). The 5-view
  # val-subset curve LOOKED flat from ~60k on, but full 75-view eval-set PSNR
  # -- the real metric -- showed NO plateau through 150000:
  #
  #   25k  43.460   50k  45.605 (+0.858/10k)   75k  46.386 (+0.312/10k)
  #  100k  47.583 (+0.479/10k)  112.5k 48.184 (+0.481/10k)
  #  125k  49.025 (+0.673/10k)  137.5k 48.765 (-0.208/10k, see below)
  #  150k  50.069 (+1.043/10k)
  #
  # The 137.5k dip was verified REAL, not measurement noise: evaluate.py's
  # test-time render has perturb=0.0 and raw_noise_std=0.0, so re-running the
  # eval on the SAME 137500.tar checkpoint twice produced bit-identical
  # 48.765 dB both times. So checkpoint-to-checkpoint variance of roughly
  # +-0.5-1 dB from ordinary SGD noise sits on top of a curve that was still
  # climbing at 150k, faster than at 75k-100k, not slower. Extending again
  # rather than locking on a curve with no observed knee, to 200000 -- Phase
  # 2's own iteration count (D-016, 31.550 dB on Lego) -- as the next real
  # data point, not a number picked in advance.
  iterations: 200000

logging:
  eval_every: 2500          # 40 val points across the run (sweep default: 10000)
  # Tightened 25000 -> 12500 for the 100k-150k extension so intermediate
  # checkpoints exist to measure the REAL full-eval-set PSNR against, not just
  # the noisy 5-view proxy that misled the first read of this curve. Lands
  # saves at 112500 / 125000 / 137500 / 150000.
  checkpoint_every: 12500
